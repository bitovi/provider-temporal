        description: Create a search attribute https://docs.temporal.io/visibility#search-attribute in a Temporal Cloud namespace https://registry.terraform.io/providers/temporalio/temporalcloud/latest/docs/resources/namespace. Note the limits on quantity https://docs.temporal.io/cloud/limits#number-of-custom-search-attributes and naming https://docs.temporal.io/cloud/limits#custom-search-attribute-names.
