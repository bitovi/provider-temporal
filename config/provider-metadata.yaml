    temporalcloud_namespace_tags:
        subCategory: ""
        description: Manages the complete set of tags for a Temporal Cloud namespace.
        name: temporalcloud_namespace_tags
        title: temporalcloud_namespace_tags Resource - terraform-provider-temporalcloud
        examples:
            - name: example
              manifest: |-
                {
                  "namespace_id": "${temporalcloud_namespace.example.id}",
                  "tags": {
                    "environment": "production",
                    "project": "temporal-workflows",
                    "team": "backend"
                  },
                  "timeouts": [
                    {
                      "create": "10m",
                      "delete": "5m"
                    }
                  ]
                }
              references:
                namespace_id: temporalcloud_namespace.example.id
              dependencies:
                temporalcloud_namespace.example: |-
                    {
                      "api_key_auth": true,
                      "name": "example-namespace",
                      "regions": [
                        "aws-us-west-2"
                      ],
                      "retention_days": 14
                    }
        argumentDocs:
            create: (String) A string that can be parsed as a duration consisting of numbers and unit suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m" (minutes), "h" (hours).
            delete: (String) A string that can be parsed as a duration consisting of numbers and unit suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m" (minutes), "h" (hours). Setting a timeout for a Delete operation is only applicable if changes are saved into state before the destroy operation occurs.
            id: (String) The ID of this namespace tags resource.
            namespace_id: (String) The ID of the namespace to manage tags for.
            tags: (Map of String) A map of tag keys to tag values.
            timeouts: (Block, Optional) (see below for nested schema)
        importStatements:
            - |-
              # Namespace Tags can be imported to incorporate existing Namespace Tags into your Terraform pipeline.
              # To import Namespace Tags, you need:
              # - a resource configuration in your Terraform configuration file/module to accept the imported Namespace Tags. In the example below, the placeholder is "temporalcloud_namespace_tags" "tags_import"
              # - the Namespace ID, which includes the Namespace Name and Account ID available at the top of the Namespace's page in the Temporal Cloud UI. In the example below, this is namespaceid.acctid
              # The import ID format is: namespaceid.acctid/tags

              terraform import temporalcloud_namespace_tags.tags_import namespaceid.acctid/tags
    temporalcloud_nexus_endpoint:
        subCategory: ""
        description: Provisions a Temporal Cloud Nexus endpoint.
        name: temporalcloud_nexus_endpoint
        title: temporalcloud_nexus_endpoint Resource - terraform-provider-temporalcloud
        examples:
            - name: nexus_endpoint
              manifest: |-
                {
                  "allowed_caller_namespaces": [
                    "${temporalcloud_namespace.caller_namespace.id}",
                    "${temporalcloud_namespace.caller_namespace_2.id}"
                  ],
                  "description": "Service Name:\n  my-hello-service\nOperation Names:\n  echo\n  say-hello\n\nInput / Output arguments are in the following repository:\nhttps://github.com/temporalio/samples-go/blob/main/nexus/service/api.go\n",
                  "name": "terraform-nexus-endpoint",
                  "worker_target": {
                    "namespace_id": "${temporalcloud_namespace.target_namespace.id}",
                    "task_queue": "terraform-task-queue"
                  }
                }
              references:
                allowed_caller_namespaces: temporalcloud_namespace.caller_namespace.id
              dependencies:
                temporalcloud_namespace.caller_namespace: |-
                    {
                      "api_key_auth": true,
                      "name": "terraform-caller-namespace",
                      "regions": [
                        "aws-us-east-1"
                      ],
                      "retention_days": 14,
                      "timeouts": [
                        {
                          "create": "10m",
                          "delete": "10m"
                        }
                      ]
                    }
                temporalcloud_namespace.caller_namespace_2: |-
                    {
                      "api_key_auth": true,
                      "name": "terraform-caller-namespace-2",
                      "regions": [
                        "gcp-us-central1"
                      ],
                      "retention_days": 14,
                      "timeouts": [
                        {
                          "create": "10m",
                          "delete": "10m"
                        }
                      ]
                    }
                temporalcloud_namespace.target_namespace: |-
                    {
                      "api_key_auth": true,
                      "name": "terraform-target-namespace",
                      "regions": [
                        "aws-us-west-2"
                      ],
                      "retention_days": 14,
                      "timeouts": [
                        {
                          "create": "10m",
                          "delete": "10m"
                        }
                      ]
                    }
        argumentDocs:
            allowed_caller_namespaces: (Set of String) Namespace Id(s) that are allowed to call this Endpoint.
            create: (String) A string that can be parsed as a duration consisting of numbers and unit suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m" (minutes), "h" (hours).
            delete: (String) A string that can be parsed as a duration consisting of numbers and unit suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m" (minutes), "h" (hours). Setting a timeout for a Delete operation is only applicable if changes are saved into state before the destroy operation occurs.
            description: (String, Sensitive) The description for the Nexus endpoint.
            id: (String) The unique identifier of the Nexus endpoint.
            name: (String) The name of the endpoint. Must be unique within an account and match ^[a-zA-Z][a-zA-Z0-9\-]*[a-zA-Z0-9]$
            namespace_id: (String) The target cloud namespace to route requests to. Namespace must be in same account as the endpoint.
            task_queue: (String) The task queue on the cloud namespace to route requests to.
            timeouts: (Block, Optional) (see below for nested schema)
            worker_target: (Attributes) A target spec for routing nexus requests to a specific cloud namespace worker. (see below for nested schema)
        importStatements:
            - "# Nexus Endpoints can be imported to incorporate existing Nexus Endpoints into your Terraform pipeline. \n# To import a Nexus Endpoint, you need\n# - a resource configuration in your Terraform configuration file/module to accept the imported Nexus Endpoint. In the example below, the placeholder is \"temporalcloud_nexus_endpoint\" \"nexus_endpoint\"\n# - the Nexus Endpoint's ID, which is found using the Temporal Cloud CLI tcld nexus endpoint list. In the example below, this is 405f7da4224a43d99c211904ed9b3819\n\nterraform import temporalcloud_nexus_endpoint.nexus_endpoint 405f7da4224a43d99c211904ed9b3819"
    temporalcloud_service_account:
        subCategory: ""
        description: Provisions a Temporal Cloud Service Account.
        name: temporalcloud_service_account
        title: temporalcloud_service_account Resource - terraform-provider-temporalcloud
        examples:
            - name: global_service_account
              manifest: |-
                {
                  "account_access": "admin",
                  "name": "admin"
                }
              dependencies:
                temporalcloud_apikey.metrics: |-
                    {
                      "disabled": false,
                      "display_name": "metrics-scraper",
                      "expiry_time": "2027-11-01T00:00:00Z",
                      "owner_id": "${temporalcloud_service_account.metrics.id}",
                      "owner_type": "service-account"
                    }
                temporalcloud_namespace.namespace: |-
                    {
                      "accepted_client_ca": "${base64encode(file(\"${path.module}/ca.pem\"))}",
                      "name": "terraform",
                      "regions": [
                        "aws-us-east-1"
                      ],
                      "retention_days": 14
                    }
            - name: namespace_admin
              manifest: |-
                {
                  "account_access": "developer",
                  "name": "developer",
                  "namespace_accesses": [
                    {
                      "namespace_id": "${temporalcloud_namespace.namespace.id}",
                      "permission": "admin"
                    }
                  ]
                }
              dependencies:
                temporalcloud_apikey.metrics: |-
                    {
                      "disabled": false,
                      "display_name": "metrics-scraper",
                      "expiry_time": "2027-11-01T00:00:00Z",
                      "owner_id": "${temporalcloud_service_account.metrics.id}",
                      "owner_type": "service-account"
                    }
                temporalcloud_namespace.namespace: |-
                    {
                      "accepted_client_ca": "${base64encode(file(\"${path.module}/ca.pem\"))}",
                      "name": "terraform",
                      "regions": [
                        "aws-us-east-1"
                      ],
                      "retention_days": 14
                    }
            - name: metrics
              manifest: |-
                {
                  "account_access": "metricsread",
                  "name": "metrics-scraper"
                }
              dependencies:
                temporalcloud_apikey.metrics: |-
                    {
                      "disabled": false,
                      "display_name": "metrics-scraper",
                      "expiry_time": "2027-11-01T00:00:00Z",
                      "owner_id": "${temporalcloud_service_account.metrics.id}",
                      "owner_type": "service-account"
                    }
                temporalcloud_namespace.namespace: |-
                    {
                      "accepted_client_ca": "${base64encode(file(\"${path.module}/ca.pem\"))}",
                      "name": "terraform",
                      "regions": [
                        "aws-us-east-1"
                      ],
                      "retention_days": 14
                    }
        argumentDocs:
            account_access: (String) The role on the account. Must be one of admin, developer, read, or metricsread (case-insensitive). Cannot be set if namespace_scoped_access is provided.
            account_access_custom_roles: (Set of String) The set of custom role IDs assigned within account_access in addition to the built-in account_access role. Empty sets are not allowed, omit the attribute instead. Cannot be set if namespace_scoped_access is provided.
            create: (String) A string that can be parsed as a duration consisting of numbers and unit suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m" (minutes), "h" (hours).
            delete: (String) A string that can be parsed as a duration consisting of numbers and unit suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m" (minutes), "h" (hours). Setting a timeout for a Delete operation is only applicable if changes are saved into state before the destroy operation occurs.
            description: (String) The description for the service account.
            id: (String) The unique identifier of the Service Account.
            name: (String) The name associated with the service account.
            namespace_accesses: (Attributes Set) The set of namespace accesses. Empty sets are not allowed, omit the attribute instead. Service Accounts with an account_access role of admin cannot be assigned explicit permissions to namespaces. Admins implicitly receive access to all Namespaces. Cannot be set if namespace_scoped_access is provided. (see below for nested schema)
            namespace_id: (String) The namespace to assign permissions to.
            namespace_scoped_access: (Attributes) Configures this service account as a namespace-scoped service account with access to only a single namespace. The namespace assignment is immutable after creation. Cannot be set if account_access, account_access_custom_roles, or namespace_accesses are provided. (see below for nested schema)
            permission: (String) The permission to assign. Must be one of admin, write, or read (case-insensitive)
            state: (String) The current state of the Service Account.
            timeouts: (Block, Optional) (see below for nested schema)
        importStatements:
            - "# Service Accounts can be imported to incorporate existing Service Accounts into your Terraform pipeline. \n# To import a Service Account, you need\n# - a resource configuration in your Terraform configuration file/module to accept the imported Service Account. In the example below, the placeholder is \"temporalcloud_service_account\" \"saimport\"\n# - the Service Accounts's ID, which is found using the Temporal Cloud CLI tcld sa l. In the example below, this is e3cb94fbdbb845f480044d053d00665b\n\nterraform import temporalcloud_service_account.saimport e3cb94fbdbb845f480044d053d00665b"
    temporalcloud_user:
