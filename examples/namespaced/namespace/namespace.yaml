apiVersion: v1
kind: Secret
metadata:
  name: temporal-cloud-creds
  namespace: temporal-cloud
type: Opaque
stringData:
  # JSON with api_key for TerraformSetupBuilder, or put a raw API key as the whole
  # value when using a single key: TEMPORAL_CLOUD_API_KEY style secrets also work
  # if the Secret stringData value is JSON: {"api_key":"..."} or {"TEMPORAL_CLOUD_API_KEY":"..."}.
  credentials: |
    {
      "api_key": "replace-with-temporal-cloud-api-key"
    }
---
apiVersion: temporalcloud.m.bitovi.com/v1beta1
kind: ProviderConfig
metadata:
  name: temporal-cloud
  namespace: temporal-cloud
spec:
  credentials:
    source: Secret
    secretRef:
      name: temporal-cloud-creds
      namespace: temporal-cloud
      key: credentials
---
apiVersion: namespace.temporalcloud.m.bitovi.com/v1alpha1
kind: Namespace
metadata:
  name: example-dev
  namespace: temporal-cloud
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: temporal-cloud
  forProvider:
    name: example-dev
    regions:
      - aws-us-east-1
    retentionDays: 7
    apiKeyAuth: true
  # Omit Delete for a safer first experiment, or use ["*"] for full lifecycle.
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
