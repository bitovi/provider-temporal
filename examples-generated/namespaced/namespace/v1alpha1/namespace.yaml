apiVersion: namespace.temporalcloud.m.bitovi.com/v1alpha1
kind: Namespace
metadata:
  annotations:
    meta.upbound.io/example-id: namespace/v1alpha1/namespace
  labels:
    testing.upbound.io/example-name: terraform
  name: terraform
  namespace: crossplane-system
spec:
  forProvider:
    acceptedClientCa: ${base64encode(file("${path.module}/ca.pem"))}
    name: terraform
    namespaceLifecycle:
      enableDeleteProtection: true
    regions:
    - aws-us-east-1
    retentionDays: 14
